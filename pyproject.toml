[project]
name = "blackboard"
version = "0.1.0"
description = "Python implementations of various algorithms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mathlib",
    "project_euler",
    "ipython",
]

[tool.uv.workspace]
members = [
    "mathlib",
    "project_euler",
]

[tool.uv.sources]
mathlib = { workspace = true }
project_euler = { workspace = true }

[tool.pytest.ini_options]
python_files = ["*_test.py"]
pythonpath = [
    "mathlib/src",
]
testpaths = [
    "mathlib/src",
    "project_euler",
]
markers = [
    "euler: Project Euler answer regression (slow)",
    "slow: solutions too slow for a normal run",
]

[tool.pyright]
include = [
    "mathlib/src",
    "project_euler",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.1",
    "pytest-xdist>=3.6",
    "ruff>=0.16.1",
    "uv>=0.12.2",
]
